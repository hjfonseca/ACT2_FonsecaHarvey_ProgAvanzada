services:
  postgres:
    image: 'postgres:latest'
    restart: unless-stopped
    environment:
      - POSTGRES_DB=espetech_inventario_db
      - POSTGRES_PASSWORD=harvysql
      - POSTGRES_USER=harveyj
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/data/postgres

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: harvey.fonseca@espe.edu.ec
      PGADMIN_DEFAULT_PASSWORD: harvysqladmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin_data: